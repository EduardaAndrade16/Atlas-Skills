server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: atlas-skills-backend

  # H2 Database configuration for zero-setup local development
  datasource:
    url: jdbc:h2:mem:atlas_skills_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # H2 Web Console (Available at http://localhost:8080/api/v1/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
        trace: false

  # Hibernate / JPA configuration
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

atlas:
  security:
    jwt:
      # Secret key (256-bit+ secure base64 string for HMAC-SHA256)
      secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1hdGxhcy1za2lsbHMtMjU2LWJpdC1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQ=}
      # Expiration: 24 hours (86400000 ms)
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
